name: macOS checks

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Backend unit and audit checks
        run: make check
      - name: Backend integration and short-read recall
        run: make integration
      - name: Swift client checks
        run: macOSClient/scripts/check.sh
